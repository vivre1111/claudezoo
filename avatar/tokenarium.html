<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tokenarium</title>
  <style>
    :root {
      color-scheme: dark;
      --ink:#f4f6ef; --dim:#9da9a0; --faint:#68736b;
      --glass:rgba(18,29,27,.78); --line:rgba(190,255,215,.13);
      --green:#87f2b2; --amber:#ffd37a; --red:#ff8b8b; --blue:#8ecaff;
      --bg:#07110f;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}
    body{overflow-x:hidden}
    body:before,body:after{content:"";position:fixed;inset:auto;pointer-events:none;filter:blur(1px);opacity:.62}
    body:before{width:55vw;height:55vw;left:-18vw;top:-24vw;background:radial-gradient(circle,rgba(45,184,123,.17),transparent 68%)}
    body:after{width:50vw;height:50vw;right:-24vw;bottom:-25vw;background:radial-gradient(circle,rgba(85,126,255,.14),transparent 68%)}
    .grain{position:fixed;inset:0;pointer-events:none;opacity:.17;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.12'/%3E%3C/svg%3E")}
    main{position:relative;max-width:1180px;margin:auto;padding:34px 26px 52px}
    header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px}
    .brand{display:flex;gap:15px;align-items:center}
    .mark{width:48px;height:48px;border:1px solid rgba(135,242,178,.4);border-radius:17px;display:grid;place-items:center;background:rgba(83,206,139,.1);box-shadow:0 0 34px rgba(67,220,137,.12);font-size:23px}
    h1{font-size:22px;letter-spacing:.05em;margin:1px 0 3px;font-weight:650}
    .subtitle{color:var(--dim);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
    .privacy{font-size:11px;color:#a8cbb4;border:1px solid rgba(135,242,178,.2);background:rgba(89,199,137,.07);padding:8px 11px;border-radius:999px;white-space:nowrap}
    .privacy:before{content:"●";color:var(--green);margin-right:7px}
    .summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}
    .metric,.panel{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(18px);box-shadow:0 18px 60px rgba(0,0,0,.18)}
    .metric{padding:15px 17px;border-radius:18px}
    .metric b{display:block;font:600 25px/1.1 ui-monospace,SFMono-Regular,Consolas,monospace;margin-bottom:6px}
    .metric span{font-size:11px;color:var(--dim);letter-spacing:.12em}
    .section-head{display:flex;justify-content:space-between;align-items:end;margin:30px 2px 13px}
    .section-head h2{font-size:13px;font-weight:600;letter-spacing:.16em;margin:0;text-transform:uppercase;color:#cee0d3}
    .section-head small{color:var(--faint)}
    .habitats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .habitat{--h:145;position:relative;min-height:184px;border:1px solid color-mix(in srgb,hsl(var(--h) 68% 65%) 23%,transparent);border-radius:24px;padding:18px;overflow:hidden;background:linear-gradient(145deg,color-mix(in srgb,hsl(var(--h) 50% 21%) 25%,var(--glass)),rgba(11,19,18,.86));transition:transform .22s ease,border-color .22s ease}
    .habitat:hover{transform:translateY(-2px);border-color:color-mix(in srgb,hsl(var(--h) 70% 70%) 44%,transparent)}
    .habitat:after{content:"";position:absolute;width:150px;height:150px;right:-60px;bottom:-70px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,color-mix(in srgb,hsl(var(--h) 80% 60%) 14%,transparent),transparent 70%)}
    .topline{display:flex;gap:15px;align-items:flex-start}
    .creature{width:66px;height:66px;flex:none;border-radius:23px;display:grid;place-items:center;font-size:34px;background:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.11);position:relative;filter:drop-shadow(0 8px 15px rgba(0,0,0,.28));animation:float 4s ease-in-out infinite}
    .creature:after{content:"";position:absolute;inset:8px;border-radius:50%;box-shadow:0 0 25px color-mix(in srgb,hsl(var(--h) 90% 70%) 32%,transparent);z-index:-1}
    @keyframes float{50%{transform:translateY(-4px) rotate(1deg)}}
    .identity{min-width:0;flex:1}.identity h3{font-size:15px;margin:3px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.identity .meta{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .state{display:inline-flex;align-items:center;gap:7px;margin-top:12px;font-size:12px;color:#d8e5dc}.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);box-shadow:0 0 9px currentColor}
    [data-state="working"] .dot{background:var(--green);color:var(--green);animation:pulse 1.25s ease infinite}
    [data-state="thinking"] .dot{background:var(--blue);color:var(--blue);animation:pulse 1.7s ease infinite}
    [data-state="waiting"] .dot,[data-state="paused"] .dot{background:var(--amber);color:var(--amber)}
    [data-state="error"] .dot{background:var(--red);color:var(--red);animation:pulse .8s ease infinite}
    @keyframes pulse{50%{opacity:.35;transform:scale(.78)}}
    .last-user{display:flex;gap:8px;align-items:flex-start;margin-top:12px;padding:9px 10px;border-left:2px solid color-mix(in srgb,hsl(var(--h) 75% 69%) 52%,transparent);border-radius:0 10px 10px 0;background:rgba(255,255,255,.025);color:#aebdb4;font-size:10px;line-height:1.45}.last-user b{flex:none;color:#74857b;font-size:9px;font-weight:600;letter-spacing:.08em}.last-user span{display:-webkit-box;overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical}
    .details{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.chip{font-size:10px;color:#b8c5bc;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.035);padding:5px 8px;border-radius:999px}.chip.helper{color:#c6b7ff;border-color:rgba(173,146,255,.2)}
    .foot{display:flex;align-items:center;justify-content:flex-end;margin-top:12px}
    .age{font:10px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--faint)}
    .folder-btn{margin-left:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);color:#91a198;cursor:pointer;font:10px/1 "Segoe UI","Microsoft YaHei",sans-serif;padding:6px 8px;border-radius:9px;white-space:nowrap}.folder-btn:hover{color:var(--green);border-color:rgba(135,242,178,.24);background:rgba(135,242,178,.08)}
    .empty{grid-column:1/-1;text-align:center;padding:55px 20px;border:1px dashed var(--line);border-radius:24px;color:var(--dim)}.empty .moon{font-size:38px;margin-bottom:12px}
    .cinema{position:relative;border-radius:27px;padding:23px;display:grid;grid-template-columns:112px 1fr;gap:22px;overflow:hidden;background:linear-gradient(135deg,rgba(47,37,28,.86),rgba(18,25,24,.88));border-color:rgba(255,211,122,.2)}
    .poster{height:148px;border-radius:16px;border:1px solid rgba(255,230,188,.18);background:radial-gradient(circle at 55% 28%,rgba(255,219,152,.27),transparent 20%),linear-gradient(155deg,#59432f,#151d1a 68%);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-shadow:0 15px 34px rgba(0,0,0,.35)}
    .poster:before{content:"✦";font-size:29px;color:#ffd78d;margin:auto;text-shadow:0 0 22px #ffbd55}.poster b{font-size:12px}.poster small{color:#cfbfa6;margin-top:3px}
    .film-kicker{font-size:10px;letter-spacing:.18em;color:#e6bc73;text-transform:uppercase;margin:5px 0 12px}.film h3{font:500 25px/1.18 Georgia,"Songti SC",serif;margin:0 0 4px}.film .en{color:#aa9f8c;font:italic 13px Georgia,serif}.film p{max-width:650px;color:#d1cdc3;font-size:13px;line-height:1.7;margin:17px 0 0}.film .count{position:absolute;right:20px;top:18px;color:#807564;font:10px ui-monospace,monospace}
    .errorbox{display:none;padding:14px;border:1px solid rgba(255,139,139,.25);background:rgba(120,30,30,.14);color:#ffc0c0;border-radius:14px;margin-bottom:15px;font-size:12px}
    footer{margin-top:24px;color:#59665d;font-size:10px;display:flex;justify-content:space-between;gap:16px}
    .shellbar{display:none}
    body.desktop{background:transparent}
    body.desktop main{padding:12px 13px 28px}
    body.desktop .shellbar{position:sticky;top:0;z-index:20;height:43px;display:flex;align-items:center;gap:8px;padding:0 9px 0 13px;border:1px solid rgba(190,255,215,.14);border-radius:16px;background:rgba(8,19,16,.93);backdrop-filter:blur(22px);box-shadow:0 10px 36px rgba(0,0,0,.3);margin:10px 12px 2px}
    .drag-zone{min-width:0;flex:1;height:100%;display:flex;align-items:center;gap:9px;cursor:grab;user-select:none}
    .drag-zone:active{cursor:grabbing}.drag-zone i{font-style:normal;color:var(--green);font-size:15px}.drag-zone span{font-size:11px;letter-spacing:.13em;color:#c7d7cd}.drag-zone small{font-size:9px;color:#617067;letter-spacing:0}
    .window-actions{display:flex;gap:3px}.window-actions button{width:29px;height:29px;border:0;border-radius:9px;color:#91a198;background:transparent;cursor:pointer;font:15px/1 "Segoe UI",sans-serif}.window-actions button:hover{color:var(--ink);background:rgba(255,255,255,.08)}.window-actions .close:hover{color:#ffd1d1;background:rgba(229,78,78,.2)}
    body.desktop>main>header{display:none}
    body.desktop .summary{gap:7px;margin-bottom:14px}.desktop .metric{border-radius:15px;padding:11px 12px}.desktop .metric b{font-size:20px}.desktop .metric span{font-size:9px}
    body.desktop .section-head{margin:19px 2px 10px}.desktop .section-head h2{font-size:10px}.desktop .section-head small{font-size:9px}
    body.desktop .habitats{grid-template-columns:1fr;gap:9px}.desktop .habitat{min-height:148px;border-radius:19px;padding:14px}.desktop .creature{width:55px;height:55px;border-radius:18px;font-size:28px}.desktop .identity h3{font-size:13px}.desktop .details{margin-top:13px}.desktop .foot{margin-top:10px}
    body.desktop .cinema{grid-template-columns:72px 1fr;gap:14px;border-radius:20px;padding:15px}.desktop .poster{height:102px;border-radius:12px;padding:9px}.desktop .film-kicker{font-size:8px;margin:2px 0 8px}.desktop .film h3{font-size:18px}.desktop .film p{font-size:11px;line-height:1.55;margin-top:10px}.desktop footer{padding:0 3px}
    @media(max-width:720px){main{padding:23px 15px 38px}.habitats{grid-template-columns:1fr}.cinema{grid-template-columns:82px 1fr;gap:16px}.poster{height:118px}.film h3{font-size:20px}.privacy{display:none}}
    @media(max-width:430px){.summary{gap:7px}.metric{padding:12px}.metric b{font-size:20px}.cinema{grid-template-columns:1fr}.poster{display:none}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="grain"></div>
  <div class="shellbar">
    <div class="drag-zone pywebview-drag-region"><i>✺</i><span>TOKENARIUM</span><small>右下角观察站</small></div>
    <div class="window-actions">
      <button id="shell-fold" title="收起 / 展开">—</button>
      <button id="shell-close" class="close" title="关闭">×</button>
    </div>
  </div>
  <main>
    <header>
      <div class="brand"><div class="mark">✺</div><div><h1>Tokenarium</h1><div class="subtitle">令牌生态园 · 夜间观察站</div></div></div>
      <div class="privacy">严格本地 · 仅元数据</div>
    </header>

    <div id="error" class="errorbox"></div>
    <section class="summary">
      <div class="metric"><b id="visible">—</b><span>栖息地</span></div>
      <div class="metric"><b id="busy">—</b><span>正在活动</span></div>
      <div class="metric"><b id="needs">—</b><span>等你经过</span></div>
    </section>

    <div class="section-head"><h2>Living habitats</h2><small id="stamp">正在辨认足迹…</small></div>
    <section class="habitats" id="habitats"></section>

    <div class="section-head"><h2>Midnight screening</h2><small>每天一部，随园内气氛变化</small></div>
    <section class="panel cinema" id="cinema"></section>

    <footer><span>不读取认证信息、不恢复会话、不向外发送数据</span><span id="source">Tokenarium local observer</span></footer>
  </main>

  <template id="card-template">
    <article class="habitat">
      <div class="topline"><div class="creature"></div><div class="identity"><h3></h3><div class="meta"></div><div class="state"><i class="dot"></i><span></span></div></div></div>
      <div class="last-user"><b>你说</b><span></span></div>
      <div class="details"></div>
      <div class="foot"><span class="age"></span><button class="folder-btn" tabindex="-1" title="用资源管理器打开项目文件夹">📁 项目目录</button></div>
    </article>
  </template>

  <script>
    const q = s => document.querySelector(s);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const STATE_NAME = {working:'忙碌',thinking:'思考',waiting:'等你',paused:'暂停',error:'遇到问题',sleeping:'睡着',quiet:'安静'};
    let timer;
    const desktop = new URLSearchParams(location.search).get('desktop') === '1';
    if(desktop) document.body.classList.add('desktop');

    function ago(seconds){
      if(seconds == null) return '时间未知';
      if(seconds < 60) return `${Math.max(0,Math.round(seconds))} 秒前`;
      if(seconds < 3600) return `${Math.round(seconds/60)} 分钟前`;
      if(seconds < 86400) return `${Math.round(seconds/3600)} 小时前`;
      return `${Math.round(seconds/86400)} 天前`;
    }
    function tokenLabel(n){
      n = Number(n)||0; if(!n) return '';
      return n >= 1000000 ? `${(n/1000000).toFixed(1)}m tokens` : n >= 1000 ? `${Math.round(n/1000)}k tokens` : `${n} tokens`;
    }
    function chip(text, cls=''){ return text ? `<span class="chip ${cls}">${esc(text)}</span>` : ''; }
    function renderCard(c, now){
      const node = q('#card-template').content.firstElementChild.cloneNode(true);
      node.style.setProperty('--h', c.hue);
      node.dataset.state = c.state;
      node.querySelector('.creature').textContent = c.emoji;
      node.querySelector('h3').textContent = c.name;
      node.querySelector('.meta').textContent = `${c.species} · ${c.folder}`;
      node.querySelector('.state span').textContent = c.activity;
      const ask = node.querySelector('.last-user');
      if(c.ask){ ask.querySelector('span').textContent=c.ask; ask.title=c.ask; }
      else ask.remove();
      const model = [c.model, c.reasoning].filter(Boolean).join(' · ');
      const bits = [chip(STATE_NAME[c.state]), chip(model), chip(tokenLabel(c.tokens))];
      if(c.helpers) bits.push(chip(`${c.activeHelpers}/${c.helpers} 协作伙伴`, 'helper'));
      if(c.branch) bits.push(chip(`⑂ ${c.branch}`));
      node.querySelector('.details').innerHTML = bits.join('');
      node.querySelector('.age').textContent = c.ageSeconds == null ? '' : ago(c.ageSeconds + Math.max(0,Date.now()/1000-now));
      const btn = node.querySelector('.folder-btn');
      if(!c.canOpen) btn.remove();
      else btn.onclick = event => {
        event.preventDefault(); event.stopPropagation();
        const normal = '📁 项目目录';
        btn.disabled = true; btn.textContent = '正在打开…';
        btn.animate([{transform:'scale(1)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:220,easing:'ease-out'});
        fetch(`/api/open-folder?id=${encodeURIComponent(c.id)}`,{cache:'no-store'})
          .then(async res => { const result=await res.json(); if(!res.ok||!result.ok) throw new Error(); btn.textContent='✓ 已打开'; })
          .catch(()=>{btn.textContent='目录不可用';})
          .finally(()=>setTimeout(()=>{btn.disabled=false;btn.textContent=normal},1400));
      };
      return node;
    }
    function renderMovie(m){
      q('#cinema').innerHTML = `<div class="poster"><b>${esc(m.title)}</b><small>${esc(m.year)}</small></div><div class="film"><div class="film-kicker">Tonight's recommendation</div><h3>${esc(m.title)}</h3><div class="en">${esc(m.en)} · ${esc(m.year)}</div><p>${esc(m.note)}</p><span class="count">${m.index} / ${m.total}</span></div>`;
    }
    async function refresh(){
      try{
        const res = await fetch('/api/snapshot',{cache:'no-store'});
        if(!res.ok) throw new Error(`本地观察器返回 ${res.status}`);
        const data = await res.json();
        q('#error').style.display='none';
        q('#visible').textContent=data.summary.visible;
        q('#busy').textContent=data.summary.busy;
        q('#needs').textContent=data.summary.needsYou;
        q('#stamp').textContent=`${new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})} · ${data.summary.helpers} 位协作伙伴`;
        q('#source').textContent=data.source.available ? `${data.source.stateDb} + ${data.source.historyDb}` : '未找到本地 Codex 数据库';
        const root=q('#habitats'); root.replaceChildren();
        if(!data.sessions.length){
          root.innerHTML='<div class="empty"><div class="moon">☾</div>今晚没有新鲜足迹。<br><small>新的本地 Codex 任务出现后，会自己找到这里。</small></div>';
        }else data.sessions.forEach(c=>root.appendChild(renderCard(c,data.now)));
        renderMovie(data.movie);
      }catch(err){
        q('#error').textContent=`观察暂时中断：${err.message}`; q('#error').style.display='block';
      }
    }
    refresh(); timer=setInterval(refresh,5000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden) refresh()});
    q('#shell-fold').onclick=()=>fetch('/api/ui?set=toggle',{cache:'no-store'});
    q('#shell-close').onclick=()=>fetch('/api/ui?set=close',{cache:'no-store'});
  </script>
</body>
</html>
